# "Top 15 ações pagadoras de dividendos" (decisão D122), dividend yield dos últimos 12 meses.
#
# COM REDE: baixa da B3 os proventos em dinheiro por ação de cada empresa do cadastro (config/acoes.json) e usa o preço de fechamento
# já guardado em historico/acoes.json. Roda TODO DIA ÚTIL, depois do job "Atualizar Top 15 Empresas Endividadas" (23h45 de
# Brasília), e sob demanda. Leva uns 5 minutos por causa da pausa entre as chamadas à B3.
# Auditoria (desenho da D89): a pasta completa em auditoria/acoes-dividendos/<data>/ só é gravada na primeira execução do mês (ou
# se os parâmetros ou o código de cálculo mudarem, ou com "auditoria completa" marcada na execução manual). Nos outros dias o
# ranking é recalculado e CONFERIDO de forma independente em memória antes de publicar.
#
# PUBLICAÇÃO: o ranking só chega ao app se config/acoes-dividendos.json → publicacao.aprovadoPeloResponsavel for true E passar na
# trava de sanidade. Acesso ABERTO (sem código): webapp-src/src/data/acoesDividendos.json. Se qualquer etapa falhar (a B3 mudou o
# formato, resultado inverossímil, conferência divergente), o job termina com erro SEM publicar e o GitHub envia e-mail.

name: Atualizar Top 15 Ações Pagadoras de Dividendos

on:
  schedule:
    - cron: '15 3 * * 2-6' # terça a sábado, 03h15 UTC = terça a sábado, 00h15 de Brasília (depois das endividadas, 23h45)
  workflow_dispatch:
    inputs:
      auditoria_completa:
        description: 'Gravar a pasta de auditoria completa mesmo que já exista uma neste mês'
        type: boolean
        required: false
        default: false

env:
  COMPLETA: ${{ github.event.inputs.auditoria_completa == 'true' && '--completa' || '' }}

permissions:
  contents: write

concurrency:
  group: acoes-dividendos # nunca duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Testes da metodologia (leitor da B3, cálculo, auditoria e publicação)
        run: node --test scripts/acoes-dividendos.test.mjs scripts/auditoria-diaria.test.mjs

      - name: Baixar da B3, calcular, conferir, gravar a auditoria (se for a completa do mês) e verificar
        run: node scripts/atualizar-acoes-dividendos.mjs $COMPLETA

      - name: Guardar a auditoria desta execução (mesmo se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-acoes-dividendos
          path: auditoria/acoes-dividendos
          if-no-files-found: ignore
          retention-days: 30

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          ALVOS="auditoria/acoes-dividendos webapp-src/src/data/acoesDividendos.json"
          if [ -z "$(git status --porcelain $ALVOS)" ]; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add $ALVOS
          git commit -m "dados: Top 15 ações pagadoras de dividendos ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
