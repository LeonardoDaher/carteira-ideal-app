# Rankings "Top 15 mais negociados" (ETFs, FIIs, ações e BDRs, D70 e D71) e "Top 15 BDRs com maior desconto de preço" (D70).
#
# Quase tudo SEM rede: lê os históricos diários que os jobs já mantêm (historico/etfs.json, fiis.json, acoes.json e bdrs.json,
# do Boletim de Preços da B3), calcula os rankings e grava a TRILHA DE AUDITORIA em
# auditoria/top15-<classe>/<data>/ (manifesto com sha256, insumos congelados, memória de cálculo, CSVs).
# A ÚNICA etapa com rede são os rankings de índice (IFIX e Ibovespa, D72): baixam a carteira do dia na B3. Se a B3 falhar,
# os outros rankings seguem e são guardados, e o job termina com ERRO no fim (o GitHub envia e-mail). Em seguida refaz o cálculo a partir dos insumos gravados (verificação independente).
#
# PUBLICAÇÃO: o ranking só chega ao app se config/top15-etfs.json (ou top15-bdrs.json) → publicacao.aprovadoPeloResponsavel
# for true E passar na trava de sanidade. Os rankings de "mais negociados" têm acesso ABERTO (sem código; arquivos
# etfsMaisNegociados.json, fiisMaisNegociados.json, acoesMaisNegociadas.json e bdrsMaisNegociados.json em webapp-src/src/data). BDRs com desconto: COM
# CÓDIGO do mês próprio (TOP15_BDRS_CODIGOS): o arquivo público (webapp-src/src/data/bdrsDesconto.json) traz só o
# cabeçalho, sem nenhum BDR; a lista fica em dados-privados/bdr-desconto.json, entregue por api/top15-bdrs.
#
# Roda no dia 22 de cada mês (depois do job de FIIs, dia 21) e sob demanda. Se qualquer etapa falhar (resultado
# inverossímil, verificação divergente), o job termina com erro SEM guardar nada no repositório (a auditoria fica como
# artefato do workflow) e o GitHub envia e-mail.

name: Atualizar Top 15 ETFs e BDRs

on:
  schedule:
    - cron: '0 6 22 * *' # dia 22, 06h UTC = 03h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top15-mercado # nunca duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Testes da metodologia (cálculo, auditoria e publicação)
        run: node --test scripts/top15-mercado.test.mjs scripts/b3-indices.test.mjs

      - name: Ranking de ETFs mais negociados (calcula, grava a auditoria e verifica)
        run: node scripts/atualizar-top15-mercado.mjs etfs

      - name: Ranking de BDRs com maior desconto de preço (calcula, grava a auditoria e verifica)
        run: node scripts/atualizar-top15-mercado.mjs bdrs

      - name: Ranking de FIIs mais negociados (calcula, grava a auditoria e verifica)
        run: node scripts/atualizar-top15-mercado.mjs fiis

      - name: Ranking de ações mais negociadas (calcula, grava a auditoria e verifica)
        run: node scripts/atualizar-top15-mercado.mjs acoes

      - name: Ranking de BDRs mais negociados (calcula, grava a auditoria e verifica)
        run: node scripts/atualizar-top15-mercado.mjs bdrs-negociados

      - name: Ranking dos maiores pesos do IFIX (baixa a carteira da B3, calcula, grava a auditoria e verifica)
        id: ifix
        continue-on-error: true
        run: node scripts/atualizar-top15-mercado.mjs ifix

      - name: Ranking dos maiores pesos do Ibovespa (baixa a carteira da B3, calcula, grava a auditoria e verifica)
        id: ibov
        continue-on-error: true
        run: node scripts/atualizar-top15-mercado.mjs ibov

      - name: Guardar a auditoria dos índices que falharam só como artefato (não vai para o repositório)
        if: steps.ifix.outcome == 'failure' || steps.ibov.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-indices-com-falha
          path: |
            auditoria/top15-ifix
            auditoria/top15-ibov
          if-no-files-found: ignore
          retention-days: 30

      - name: Desfazer no clone o que um índice com falha gravou (para não ir ao repositório)
        if: steps.ifix.outcome == 'failure' || steps.ibov.outcome == 'failure'
        run: |
          for c in ifix ibov; do
            if [ "${{ steps.ifix.outcome }}" = "failure" ] && [ "$c" = "ifix" ] || [ "${{ steps.ibov.outcome }}" = "failure" ] && [ "$c" = "ibov" ]; then
              git checkout -- auditoria/top15-$c 2>/dev/null || true
              git clean -fdq auditoria/top15-$c
              echo "Restaurado: auditoria/top15-$c"
            fi
          done

      - name: Guardar a auditoria desta execução (mesmo se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-top15-mercado
          path: |
            auditoria/top15-etfs
            auditoria/top15-fiis
            auditoria/top15-acoes
            auditoria/top15-bdrs-negociados
            auditoria/top15-ifix
            auditoria/top15-ibov
            auditoria/top15-bdrs
          if-no-files-found: ignore
          retention-days: 30

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          ALVOS="auditoria/top15-etfs auditoria/top15-fiis auditoria/top15-acoes auditoria/top15-bdrs-negociados auditoria/top15-ifix auditoria/top15-ibov auditoria/top15-bdrs webapp-src/src/data/ifixMaioresPesos.json webapp-src/src/data/ibovMaioresPesos.json webapp-src/src/data/etfsMaisNegociados.json webapp-src/src/data/fiisMaisNegociados.json webapp-src/src/data/acoesMaisNegociadas.json webapp-src/src/data/bdrsMaisNegociados.json webapp-src/src/data/bdrsDesconto.json dados-privados/bdr-desconto.json"
          if [ -z "$(git status --porcelain $ALVOS)" ]; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add $ALVOS
          git commit -m "dados: Top 15 mais negociados e BDRs com desconto ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Falhar se a B3 não entregou a carteira de algum índice
        if: steps.ifix.outcome == 'failure' || steps.ibov.outcome == 'failure'
        run: |
          echo "IFIX: ${{ steps.ifix.outcome }} · Ibovespa: ${{ steps.ibov.outcome }}"
          echo "Os demais rankings foram guardados; o índice que falhou ficou como estava."
          exit 1
