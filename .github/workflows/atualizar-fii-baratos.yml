# Triagem "FIIs baratos" (Tijolo e Papel), decisão D59.
#
# Baixa o Informe Mensal de FII da CVM, junta com a cotação e o volume que o job de FIIs já mantém
# (webapp-src/src/data/rendimentosFii.json), calcula os dois rankings e a lista "a conferir" e grava a
# TRILHA DE AUDITORIA em auditoria/fii-baratos/<data>/ (manifesto com sha256 das fontes, insumos
# congelados, memória de cálculo por fundo, exclusões). Em seguida refaz o cálculo a partir dos
# insumos gravados (verificação independente) e só então guarda a auditoria no repositório.
#
# PUBLICAÇÃO (D65): o ranking só chega ao app se config/fii-baratos.json → publicacao.aprovadoPeloResponsavel
# for true E passar na trava de sanidade. Chega COM CÓDIGO do mês: o arquivo público do app
# (webapp-src/src/data/fiiBaratos.json) traz só o cabeçalho, sem nenhum fundo; a lista fica em
# dados-privados/fii-baratos.json, entregue por api/top15-fiis só a quem tem o código.
#
# Roda TODO DIA ÚTIL (D89), depois do preço diário dos FIIs (22h15 de Brasília), e sob demanda. Na primeira execução do mês
# (ou se os parâmetros ou o código de cálculo mudarem, ou com "auditoria completa" marcada) baixa o informe da CVM e grava a
# pasta de auditoria completa; nos outros dias reaproveita o informe congelado nessa pasta, troca só o preço diário e CONFERE o
# cálculo de forma independente em memória antes de publicar (sem pasta nova). Se a cotação for mais velha que
# dados.cotacaoMaxIdadeDias, os fundos saem com o motivo "cotacao_defasada".
#
# Se qualquer etapa falhar (layout da CVM mudou, resultado inverossímil, verificação divergente), o
# job termina com erro SEM guardar a auditoria no repositório (ela fica como artefato do workflow) e
# o GitHub envia e-mail.

name: Atualizar FIIs Baratos

on:
  schedule:
    - cron: '45 2 * * 2-6' # terça a sábado, 02h45 UTC = segunda a sexta, 23h45 de Brasília
  workflow_dispatch:
    inputs:
      auditoria_completa:
        description: 'Baixar o informe da CVM e gravar a pasta de auditoria completa mesmo que já exista uma neste mês'
        type: boolean
        required: false
        default: false

env:
  COMPLETA: ${{ github.event.inputs.auditoria_completa == 'true' && '--completa' || '' }}

permissions:
  contents: write

concurrency:
  group: fii-baratos # nunca duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Testes da metodologia (cálculo, extração e auditoria)
        run: node --test scripts/fii-baratos.test.mjs scripts/auditoria-diaria.test.mjs

      - name: Baixar o informe da CVM, calcular e gravar a auditoria
        run: node scripts/atualizar-fii-baratos.mjs $COMPLETA

      - name: Guardar a auditoria desta execução (mesmo se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-fii-baratos
          path: auditoria/fii-baratos
          if-no-files-found: ignore
          retention-days: 30

      - name: Verificar a auditoria (refaz o cálculo só com os insumos gravados)
        run: node scripts/fii-baratos-verificar.mjs ultima

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain auditoria/fii-baratos webapp-src/src/data/fiiBaratos.json dados-privados/fii-baratos.json)" ]; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add auditoria/fii-baratos webapp-src/src/data/fiiBaratos.json dados-privados/fii-baratos.json
          git commit -m "dados: Top 15 FIIs baratos ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
