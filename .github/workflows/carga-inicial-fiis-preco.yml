# Carga inicial do histórico de preço diário dos FIIs (decisão D63). Rodar UMA VEZ, à mão, antes do job diário
# "Atualizar preço diário dos FIIs" (e de novo só se o arquivo historico/fiis.json se perder).
#
# Baixa os boletins de preços da B3 dos pregões mais recentes (padrão: 60; a triagem usa 21, e o histórico
# guarda no máximo 80 por padrão em config/fiis-preco.json), um por vez, com 1 segundo de pausa. Na carga
# dos ETFs, cada pregão levou cerca de 6 segundos (260 pregões em 28 minutos): 60 pregões ficam em ~6 minutos.
#
# O histórico é publicado MESMO se a execução falhar ou for interrompida (passo final com "if: always()"):
# nada do que já foi baixado se perde, e rodar de novo só baixa o que falta.

name: Carga inicial de FIIs (preço diário)

on:
  workflow_dispatch:
    inputs:
      pregoes:
        description: 'Quantos pregões carregar (máximo 80)'
        required: true
        default: '60'

permissions:
  contents: write

concurrency:
  group: fiis-preco
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Baixar os boletins e montar o histórico
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/atualizar-fiis-historico.mjs --carga-inicial=${{ github.event.inputs.pregoes }}

      - name: Publicar (commit) o que foi carregado
        if: always()
        run: |
          if [ ! -f historico/fiis.json ]; then
            echo "Nenhum histórico gravado."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add historico/fiis.json
          git commit -m "dados: carga inicial do preço diário dos FIIs ($(date -u +%Y-%m-%d))" || { echo "Nada a publicar."; exit 0; }
          git pull --rebase
          git push
