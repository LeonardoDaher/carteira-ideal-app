# Atualiza nos dias úteis os dados da aba de BDRs (decisões D19 e D24): os 35 BDRs de ações e
# os 5 BDRs de ETF com maior volume médio em reais nos últimos 21 pregões, com fechamento,
# variação de 3 meses e faixa de 52 semanas.
#
# Fonte do preço e do volume (D24): Boletim de Preços oficial da B3 (BVBG.086), sem cota, o
# mesmo arquivo do job de ETFs (D23). A brapi (BRAPI_TOKEN) só informa nome, setor e proporção
# BDR/ação: listagem uma vez por semana e poucas consultas por dia, com teto mensal em
# config/bdrs.json (bloco "brapi", padrão 80 por mês). Se ela falhar, o job publica com o
# cadastro guardado em historico/bdrs.json.
#
# Segunda a sexta às 22h de Brasília (01h UTC do dia seguinte): depois da última versão do
# boletim (~20h30) e meia hora depois do job de ETFs, para os dois não disputarem o commit.
#
# Antes da primeira execução diária, rode UMA VEZ o workflow "Carga inicial de BDRs".
#
# Se o script encontrar algo errado, o job falha SEM alterar os arquivos: o app continua com os
# dados do último dia bom e o GitHub envia um e-mail avisando da falha. Feriado da B3 (zip
# vazio) ou pregão já processado: nada muda, sem commit e sem deploy.

# ATENÇÃO: o GitHub atrasa ou até perde disparos agendados (principalmente em minutos redondos, como :00 e :30). Por isso cada
# job tem 3 horários, fora do minuto cheio: a execução da noite, uma repetição e uma passada às 9h, antes da abertura. Rodar
# de novo sem pregão novo não altera nada (sem commit e sem deploy).
name: Atualizar BDRs

on:
  schedule:
    - cron: '7 1 * * 2-6' # terça a sábado, 01h07 UTC = segunda a sexta, 22h07 de Brasília
    - cron: '7 3 * * 2-6' # 00h07 de Brasília (repetição)
    - cron: '20 12 * * 2-6' # 9h20 de Brasília (passada antes da abertura)
    - cron: '17 5 * * 2-6' # 02h17 de Brasília (reforço da madrugada: o GitHub chegou a perder as passadas da noite)
    - cron: '17 10 * * 2-6' # 07h17 de Brasília (reforço antes da abertura)
  workflow_dispatch: {} # botão "Run workflow" para rodar manualmente

permissions:
  contents: write

concurrency:
  group: bdrs # nunca duas execuções ao mesmo tempo (as repetições não se sobrepõem)
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04 # fixo, mesmo motivo dos outros jobs
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Buscar o boletim da B3 e gerar bdrs.json
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/atualizar-bdrs.mjs

      # Compila o site com os dados novos ANTES de publicar (mesma proteção do job de mercado).
      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain webapp-src/src/data/bdrs.json historico)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add webapp-src/src/data/bdrs.json historico/bdrs.json
          git commit -m "dados: BDRs ($(date -u +%Y-%m-%d))"
          # Tenta até 5 vezes: se outro job publicou no mesmo instante, refaz o rebase e envia de novo.
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push recusado (tentativa $tentativa de 5); aguardando e tentando de novo."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Não foi possível publicar após 5 tentativas."
          exit 1
