# Preço DIÁRIO dos FIIs (decisão D63): histórico de cotação e volume dos fundos do job de FIIs, a partir do
# Boletim de Preços oficial da B3 (BVBG.086), sem chave e sem cota (o mesmo módulo dos jobs de Ações, BDRs e
# ETFs). Alimenta a triagem "FIIs baratos" com preço do dia, no lugar do preço mensal da brapi.
#
# Grava historico/fiis.json e webapp-src/src/data/fiisPreco.json (último fechamento e variação do dia, que o
# Simule FII mostra). O commit dispara o deploy da Vercel.
#
# Segunda a sexta às 21h45 de Brasília (00h45 UTC do dia seguinte): a última versão do boletim do dia sai por
# volta das 20h30. Não coincide com os outros jobs (ETFs 21h30, BDRs 22h).
#
# A brapi (BRAPI_TOKEN) só completa os poucos fundos líquidos que o boletim da B3 não traz (cerca de 3 requisições
# por dia).
#
# Antes da primeira execução diária, rode UMA VEZ o workflow "Carga inicial de FIIs (preço diário)".
#
# Se o script encontrar algo errado (boletim com data inesperada, poucos fundos no boletim, B3 fora do ar), o
# job falha SEM alterar o arquivo e o GitHub envia e-mail. Feriado da B3 (zip vazio) ou pregão já processado:
# nada muda, sem commit.

name: Atualizar preço diário dos FIIs

on:
  schedule:
    - cron: '45 0 * * 2-6' # terça a sábado, 00h45 UTC = segunda a sexta, 21h45 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fiis-preco # nunca duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Testes do histórico de preço
        run: node --test scripts/atualizar-fiis-historico.test.mjs

      - name: Buscar o boletim da B3 e atualizar historico/fiis.json
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/atualizar-fiis-historico.mjs

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain historico/fiis.json webapp-src/src/data/fiisPreco.json)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add historico/fiis.json webapp-src/src/data/fiisPreco.json
          git commit -m "dados: preço diário dos FIIs ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
