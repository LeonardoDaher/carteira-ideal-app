# Carga inicial do histórico de ETFs (decisão D23). Rodar UMA VEZ, à mão, antes do job diário
# "Atualizar ETFs" (e de novo só se o arquivo historico/etfs.json se perder).
#
# Baixa os boletins de preços da B3 dos últimos pregões (padrão: 260, o suficiente para a faixa
# de 52 semanas), um por vez, com 1 segundo de pausa: cerca de 12,7 MB por pregão, perto de
# 3,3 GB no total, e de 20 a 60 minutos. Pregão que a B3 não entregar fica de fora, com aviso no
# log; a carga segue. O histórico é gravado mesmo se ainda não der para publicar a lista.
# Pode ser rodada de novo: só baixa o que falta.
#
# Com menos pregões (ex.: 70), a lista, a média de 21 pregões e a variação de 3 meses já
# funcionam; a faixa de 52 semanas só aparece quando o histórico passar de 240 pregões.

name: Carga inicial de ETFs

on:
  workflow_dispatch:
    inputs:
      pregoes:
        description: 'Quantos pregões carregar (máximo 260)'
        required: true
        default: '260'

permissions:
  contents: write

jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Baixar os boletins e montar o histórico
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/atualizar-etfs.mjs --carga-inicial=${{ github.event.inputs.pregoes }}

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit)
        run: |
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add historico/etfs.json webapp-src/src/data/etfs.json
          git commit -m "dados: carga inicial de ETFs ($(date -u +%Y-%m-%d))" || echo "Nada a publicar."
          git pull --rebase
          git push
