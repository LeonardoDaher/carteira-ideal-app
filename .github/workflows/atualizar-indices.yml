# Atualiza nos dias úteis o histórico do IBOV e do IFIX (candles diários em pontos) para a análise técnica do Simule Ações e do
# Simule FII (D140).
#
# Fonte: arquivo de índices do Boletim Diário da B3 (IRAAMMDD.zip, XML BVBG.087), sem cota e sem secret. O arquivo do pregão sai por
# volta das 21h30 de Brasília.
#
# Antes da primeira execução diária: rode UMA VEZ o workflow "Carga inicial dos índices".
#
# Se o script encontrar algo errado, o job falha SEM alterar os arquivos. Feriado (zip vazio) ou pregão já processado: nada muda,
# sem commit e sem deploy.

# ATENÇÃO: o GitHub atrasa ou até perde disparos agendados (principalmente em minutos redondos). Por isso o job tem 3 horários, fora do
# minuto cheio: a execução da noite, uma repetição e uma passada às 9h.
name: Atualizar índices

on:
  schedule:
    - cron: '47 1 * * 2-6' # terça a sábado, 01h47 UTC = segunda a sexta, 22h47 de Brasília
    - cron: '47 3 * * 2-6' # 00h47 de Brasília (repetição)
    - cron: '25 12 * * 2-6' # 9h25 de Brasília (passada antes da abertura)
    - cron: '57 5 * * 2-6' # 02h57 de Brasília (reforço da madrugada: o GitHub chegou a perder as passadas da noite)
    - cron: '57 10 * * 2-6' # 07h57 de Brasília (reforço antes da abertura)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: indices
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Testes do job
        run: node --test scripts/atualizar-indices.test.mjs scripts/importar-indice-historico.test.mjs

      - name: Buscar o arquivo de índices da B3 e atualizar o histórico
        run: node scripts/atualizar-indices.mjs

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain webapp-src/public/dados/indices-historico)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add webapp-src/public/dados/indices-historico
          git commit -m "dados: Índices IBOV e IFIX ($(date -u +%Y-%m-%d))"
          # Tenta até 5 vezes: se outro job publicou no mesmo instante, refaz o rebase e envia de novo.
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push recusado (tentativa $tentativa de 5); aguardando e tentando de novo."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Não foi possível publicar após 5 tentativas."
          exit 1
