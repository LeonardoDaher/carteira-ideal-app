# Diagnóstico (só leitura, não faz commit): confere o formato do arquivo de índices (IR) do Boletim Diário da B3 e até que data para
# trás ele existe, para o job diário dos índices (D140). Pode ser apagado depois que o job diário estiver no ar.
name: Descobrir índices na B3 (diagnóstico)

on:
  workflow_dispatch: {}
  push:
    branches: [analise-grafica-ibov-ifix]
    paths: ['.github/workflows/descobrir-indices-b3.yml']

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Formato do XML e profundidade do histórico
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/b3 && cd /tmp/b3
          baixar() { # $1 = AAMMDD ; deixa o XML em /tmp/b3/x.xml e devolve 0 se houver pregão
            local f="IR$1"
            curl -sS -m 120 -A 'carteira-ideal (github actions)' -o "$f.zip" "https://www.b3.com.br/pesquisapregao/download?filelist=$f.zip," || return 2
            local tam; tam=$(stat -c %s "$f.zip")
            [ "$tam" -lt 1024 ] && { echo "   $f: sem arquivo (tamanho=$tam)"; rm -f "$f.zip"; return 1; }
            local interno; interno=$(unzip -Z1 "$f.zip" | grep -i '\.zip$' | head -1)
            unzip -o -q "$f.zip" "$interno" -d "$f" && unzip -o -q "$f/$interno" -d "$f/x"
            local ultimo; ultimo=$(ls "$f/x" | sort | tail -1)
            cp "$f/x/$ultimo" x.xml; rm -rf "$f" "$f.zip"; return 0
          }
          echo "=== Formato do XML (último pregão com arquivo) ==="
          for i in 1 2 3 4 5; do d=$(date -u -d "-$i day" +%y%m%d); w=$(date -u -d "-$i day" +%u); [ "$w" -lt 6 ] || continue
            if baixar "$d"; then echo "arquivo de $d"; break; fi; done
          echo "--- primeiras 40 linhas ---"; head -40 x.xml
          echo "--- todas as tags <Dt> (valor e contagem) ---"; grep -o '<Dt>[^<]*</Dt>' x.xml | sort | uniq -c
          echo "--- outras tags com 'Dt' no nome (contagem) ---"; grep -o '<[A-Za-z]*Dt[A-Za-z]*>' x.xml | sort | uniq -c
          echo "--- blocos IndxInf: $(grep -c '<IndxInf>' x.xml) ; códigos ---"; grep -A2 '<SctyId>' x.xml | grep -o '<TckrSymb>[^<]*' | sed 's/<TckrSymb>//' | tr '\n' ' '; echo
          echo "--- Ibovespa: valores de abertura/mín/máx/fechamento por pregão ---"
          echo "=== Profundidade: existe arquivo IR em datas antigas? ==="
          for anos in 1 2 3 5; do
            for k in 0 1 2 3 4; do
              d=$(date -u -d "-$anos year -$k day" +%y%m%d); w=$(date -u -d "-$anos year -$k day" +%u); [ "$w" -lt 6 ] || continue
              if baixar "$d"; then echo "   $anos ano(s) atrás: $d tem arquivo; IBOV: $(grep -A22 '<TckrSymb>IBOV<' x.xml | grep -E 'OpngPric|ClsgPric' | tr -d ' ' | tr '\n' ' ')"; break; fi
            done
          done
