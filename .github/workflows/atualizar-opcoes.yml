# Atualiza nos dias úteis os dados do Simule Opções: todas as séries de opções de ações e ETFs que negociaram nos últimos 5 pregões,
# com estilo (americana ou europeia), strike, vencimento, último preço e variação.
#
# Fontes: cadastro de instrumentos e COTAHIST diário da B3, ambos oficiais, sem cota e sem secret.
#
# Roda DEPOIS do job "Atualizar Ações" (gatilho workflow_run): é ele que grava o histórico de fechamentos de onde sai a tendência de cada
# ativo, e rodar antes deixava a tendência um dia atrás do preço mostrado. Além de esperar, o script completa a série com os fechamentos do
# COTAHIST mais novos que o histórico, então a tendência parte sempre do preço atual. Se o script achar algo errado (poucos ativos, ativos de controle ausentes, série inválida), o job
# falha SEM alterar os arquivos: o app continua com o último dia bom e o GitHub envia um e-mail avisando. Feriado da B3
# (arquivo ausente) ou pregão já processado: nada muda, sem commit e sem deploy.

# O job das ações tem 3 horários (22h22, 00h22 e 9h25 de Brasília) e cada término dispara este. Rodar de novo sem pregão novo não altera
# nada (sem commit e sem deploy). O horário abaixo é só uma rede de segurança, caso o gatilho seja perdido.
name: Atualizar Opções

on:
  workflow_run:
    workflows: ['Atualizar Ações']
    types: [completed]
  schedule:
    - cron: '5 13 * * 2-6' # terça a sábado, 13h05 UTC = 10h05 de Brasília (depois da passada das 9h25 das ações; rede de segurança)
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Refazer o pregão mesmo já processado (confere o download do cadastro)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opcoes # nunca duas execuções ao mesmo tempo (as repetições não se sobrepõem)
  cancel-in-progress: false

jobs:
  atualizar:
    # Disparado pelo job das ações, só segue se ele terminou bem (com o histórico novo gravado).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Baixar o cadastro e o COTAHIST da B3 e gerar opcoes.json
        env:
          FORCAR: ${{ inputs.forcar && '1' || '' }}
        run: node scripts/atualizar-opcoes.mjs

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain webapp-src/public/dados/opcoes.json)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add webapp-src/public/dados/opcoes.json
          git commit -m "dados: Opções ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
