# Atualiza nos dias úteis os dados do Simule Opções: todas as séries de opções de ações e ETFs que negociaram nos últimos 5 pregões,
# com estilo (americana ou europeia), strike, vencimento, último preço e variação.
#
# Fontes: cadastro de instrumentos e COTAHIST diário da B3, ambos oficiais, sem cota e sem secret.
#
# Segunda a sexta às 20h de Brasília (23h UTC do mesmo dia), a primeira da noite: o arquivo do dia sai
# por volta das 19h (o script só considera o dia de hoje a partir das 19h30). Se o script achar algo errado (poucos ativos, ativos de controle ausentes, série inválida), o job
# falha SEM alterar os arquivos: o app continua com o último dia bom e o GitHub envia um e-mail avisando. Feriado da B3
# (arquivo ausente) ou pregão já processado: nada muda, sem commit e sem deploy.

name: Atualizar Opções

on:
  schedule:
    - cron: '0 23 * * 1-5' # segunda a sexta, 23h UTC = 20h de Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Refazer o pregão mesmo já processado (confere o download do cadastro)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Baixar o cadastro e o COTAHIST da B3 e gerar opcoes.json
        env:
          FORCAR: ${{ inputs.forcar && '1' || '' }}
        run: node scripts/atualizar-opcoes.mjs

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain webapp-src/public/dados/opcoes.json)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add webapp-src/public/dados/opcoes.json
          git commit -m "dados: Opções ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
