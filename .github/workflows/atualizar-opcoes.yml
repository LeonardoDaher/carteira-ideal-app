# Atualiza nos dias úteis os dados do Simule Opções: séries de calls e puts dos 25 ativos com mais volume de opções,
# com strike, vencimento e prêmio de fechamento.
#
# Fonte: COTAHIST diário da B3 (série histórica oficial), sem cota e sem secret.
#
# Segunda a sexta às 22h15 de Brasília (01h15 UTC do dia seguinte), depois do job de ETFs (22h): o arquivo do dia sai
# por volta das 19h. Se o script achar algo errado (poucos ativos, ativos de controle ausentes, série inválida), o job
# falha SEM alterar os arquivos: o app continua com o último dia bom e o GitHub envia um e-mail avisando. Feriado da B3
# (arquivo ausente) ou pregão já processado: nada muda, sem commit e sem deploy.

name: Atualizar Opções

on:
  schedule:
    - cron: '15 1 * * 2-6' # terça a sábado, 01h15 UTC = segunda a sexta, 22h15 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Baixar o COTAHIST da B3 e gerar opcoes.json
        run: node scripts/atualizar-opcoes.mjs

      - name: Conferir se o site compila com os dados novos
        run: |
          npm ci
          npm run build

      - name: Publicar (commit) se houver mudança
        run: |
          if [ -z "$(git status --porcelain webapp-src/src/data/opcoes.json)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "${{ vars.COMMIT_AUTOR_NOME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTOR_EMAIL || '41898283+github-actions[bot]@users.noreply.github.com' }}"
          git add webapp-src/src/data/opcoes.json
          git commit -m "dados: Opções ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
