<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- D26: fontes servidas pelo próprio site (as mesmas da landing, em /assets/fonts), no lugar
         do Google Fonts: uma conexão externa a menos no carregamento. No "npm run dev" (só o app,
         sem a landing) elas não existem e o navegador usa as fontes do sistema, sem erro. -->
    <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/sora-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Sora'; font-weight: 600; font-style: normal; font-display: swap; src: url('/assets/fonts/sora-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Sora'; font-weight: 700; font-style: normal; font-display: swap; src: url('/assets/fonts/sora-latin-700-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: normal; font-display: swap; src: url('/assets/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; font-style: normal; font-display: swap; src: url('/assets/fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 600; font-style: normal; font-display: swap; src: url('/assets/fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
    </style>
    <!-- D26 (SEO): favicon apontado para o arquivo comum do site (/assets/favicon.svg), em vez do
         SVG embutido como texto (data:). Mesmo ícone; o Google lê com mais confiança um arquivo de
         verdade do que um ícone embutido no HTML. O caminho é absoluto (começa com "/"), então
         funciona em /app/ e nas outras páginas; só não aparece em "npm run dev" isolado do
         webapp-src (sem a pasta assets/ da landing por perto), o que não afeta o site publicado. -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <!-- D26 (SEO): título, descrição, canonical e prévia de link. O canonical aponta para /app/
         mesmo quando a pessoa abre ?tela=simuleFii etc.: para o Google é a mesma página. -->
    <title>App Carteira Ideal | Perfil de investidor e simuladores grátis</title>
    <meta name="description" content="Teste de perfil de investidor com carteira de referência, simuladores de Tesouro Direto, FII, BDR, ETF, ações e opções e controle do orçamento do mês. Grátis e sem cadastro." />
    <link rel="canonical" href="https://carteiraideal.app.br/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carteira Ideal" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="App Carteira Ideal: perfil de investidor e simuladores grátis" />
    <meta property="og:description" content="Perfil de investidor, carteira de referência e simuladores de Tesouro Direto, FII, BDR, ETF, ações e opções. Conteúdo educacional." />
    <meta property="og:image" content="https://carteiraideal.app.br/assets/og-image.png?v=3" />
    <meta property="og:url" content="https://carteiraideal.app.br/app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- D20: permite instalar o app no computador (Chrome/Edge: ícone "Instalar" na barra de
         endereço) e no celular (Adicionar à tela inicial). Caminhos relativos a /app/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0d13" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- Aplica o tema da landing (chave "theme") antes da primeira pintura, para o app não
         piscar no escuro enquanto o React carrega. O React confirma o mesmo valor depois. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
      <!-- Métricas de audiência sem cookies (Vercel Web Analytics). Ative em Vercel → Analytics. -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
